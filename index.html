<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Juguetería · Gravedad</title>
  <style>
    /* Paleta: crema + verdes bosque / salvia */
    :root {
      --page: #e6e3d8;
      --canvas: #f4f2ea;
      --text: #3b4a3f;
      --bosque: #2f4a39;
      --bosque-oscuro: #233a2b;
      --salvia: #a9b78f;
      --salvia-clara: #cfdcc6;
      --dock: #c9cdc0;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--page);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: system-ui, sans-serif;
      color: var(--text);
    }
    #lienzo {
      /* 402 x 874, escalado proporcionalmente si la pantalla es más pequeña */
      width: min(402px, 100vw, calc((100vh - 48px) * 402 / 874));
      aspect-ratio: 402 / 874;
      background: var(--canvas);
      overflow: hidden;
      cursor: pointer;
      border-radius: 28px;
      box-shadow: 0 6px 30px rgba(35, 58, 43, .12);
    }
    svg { display: block; width: 100%; height: 100%; }
    .forma { stroke-linejoin: round; }
    #pildora .forma    { fill: var(--dock); }
    #circulo .forma    { fill: var(--bosque); }
    #rectGrande .forma { fill: url(#niebla); }
    #rectMedio .forma  { fill: var(--salvia); }
    #triArriba .forma  { fill: var(--salvia-clara); stroke: var(--salvia-clara); }
    #triAbajo .forma   { fill: var(--bosque); stroke: var(--bosque); }
    #cuadroIzq .forma  { fill: url(#selva); }
    #cuadroDer .forma  { fill: var(--salvia); }
    /* Iconos de trazo y etiquetas: blancos por defecto, verde bosque sobre fondos claros */
    .icono { fill: none; stroke: #fff; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
    .relleno { fill: #fff; }
    .relleno-salvia { fill: var(--salvia); stroke: var(--salvia); stroke-width: 6; stroke-linejoin: round; }
    .etiqueta { fill: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .2px; }
    .icono.oscuro { stroke: var(--bosque); }
    .etiqueta.oscuro { fill: var(--bosque); }
    .suave { opacity: .7; }
    .punto { fill: var(--dock); opacity: 0; transition: opacity .6s ease; }
    .punto.activo { fill: var(--bosque); }
    .listo .punto { opacity: 1; }
    p { margin: 0; font-size: 13px; }
    .temblor { animation: temblor 520ms ease-out; }
    @keyframes temblor {
      0%   { transform: translate(0, 0) rotate(0); }
      12%  { transform: translate(-2.5px, 1.5px) rotate(-0.5deg); }
      24%  { transform: translate(2.5px, -1px) rotate(0.45deg); }
      38%  { transform: translate(-2px, 1px) rotate(-0.35deg); }
      52%  { transform: translate(1.5px, -0.5px) rotate(0.25deg); }
      68%  { transform: translate(-1px, 0.5px) rotate(-0.15deg); }
      84%  { transform: translate(0.5px, 0) rotate(0.05deg); }
      100% { transform: translate(0, 0) rotate(0); }
    }
  </style>
</head>
<body>
  <div id="lienzo" title="Toca para repetir">
    <!-- viewBox en coordenadas del diseño original; se escala a 402 x 874 -->
    <svg viewBox="0 0 818 1778" preserveAspectRatio="xMidYMid meet" aria-label="Formas cayendo con gravedad">
      <defs>
        <!-- Widget brumoso: claro arriba, salvia abajo -->
        <linearGradient id="niebla" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e3e6db" />
          <stop offset=".55" stop-color="#c3ccb6" />
          <stop offset="1" stop-color="#93a483" />
        </linearGradient>
        <!-- Widget de selva: verde muy oscuro con luz cálida arriba -->
        <linearGradient id="selva" x1="0" y1="0" x2=".35" y2="1">
          <stop offset="0" stop-color="#4f6648" />
          <stop offset=".45" stop-color="#2a3f2f" />
          <stop offset="1" stop-color="#16251b" />
        </linearGradient>
      </defs>
      <!-- Indicador de páginas: aparece al terminar -->
      <g id="puntos">
        <circle class="punto activo" cx="377" cy="1700" r="10" />
        <circle class="punto" cx="409" cy="1700" r="10" />
        <circle class="punto" cx="441" cy="1700" r="10" />
      </g>
      <!-- Píldora superior -->
      <g id="pildora">
        <rect class="forma" x="36" y="54" width="588" height="122" rx="61" stroke-width="0" />
        <!-- Barra de búsqueda -->
        <circle class="icono oscuro" cx="104" cy="109" r="20" />
        <line class="icono oscuro" x1="119" y1="124" x2="136" y2="141" />
        <text class="etiqueta oscuro suave" x="160" y="127" font-size="36" font-weight="500">Buscar</text>
      </g>
      <!-- Círculo superior: mensajes -->
      <g id="circulo">
        <circle class="forma" cx="711" cy="115" r="61" stroke-width="0" />
        <path class="relleno" transform="translate(711 118) scale(.78) translate(-711 -118)" d="M683 85 h56 a14 14 0 0 1 14 14 v28 a14 14 0 0 1 -14 14 h-28 l-20 16 v-16 h-8 a14 14 0 0 1 -14 -14 v-28 a14 14 0 0 1 14 -14 z" />
      </g>
      <!-- Rectángulo grande: widget de clima -->
      <g id="rectGrande">
        <rect class="forma" x="36" y="210" width="746" height="384" rx="32" stroke-width="0" />
        <text class="etiqueta oscuro" x="76" y="276" font-size="32" font-weight="600">Bosque nublado</text>
        <text class="etiqueta oscuro" x="70" y="392" font-size="110" font-weight="300">18°</text>
        <!-- Nube -->
        <path class="icono oscuro suave" d="M612 330 h86 a30 30 0 0 0 0 -60 a44 44 0 0 0 -84 -8 a34 34 0 0 0 -2 68 z" />
        <text class="etiqueta" x="76" y="556" font-size="26" font-weight="500">Niebla · Humedad 92%</text>
      </g>
      <!-- Rectángulo medio: reproductor -->
      <g id="rectMedio">
        <rect class="forma" x="36" y="612" width="746" height="124" rx="32" stroke-width="0" />
        <circle class="relleno" cx="108" cy="674" r="36" />
        <polygon class="relleno-salvia" points="98,656 98,692 126,674" />
        <text class="etiqueta" x="166" y="664" font-size="30" font-weight="600">Sonidos del bosque</text>
        <text class="etiqueta suave" x="166" y="702" font-size="24">Lluvia suave</text>
        <line class="icono suave" x1="540" y1="674" x2="736" y2="674" stroke-width="8" />
        <line class="icono" x1="540" y1="674" x2="618" y2="674" stroke-width="8" />
      </g>
      <!-- Triángulo superior derecho: jardín -->
      <g id="triArriba">
        <polygon class="forma" points="58,759 778,758 778,1174" stroke-width="10" />
        <path class="icono oscuro" d="M648 878 C648 826 688 800 740 800 C740 852 712 880 660 880 Z" />
        <line class="icono oscuro" x1="652" y1="876" x2="706" y2="826" />
        <text class="etiqueta oscuro" x="738" y="934" font-size="30" font-weight="600" text-anchor="end">jardín</text>
      </g>
      <!-- Triángulo inferior izquierdo: cámara -->
      <g id="triAbajo">
        <polygon class="forma" points="40,783 40,1197 758,1197" stroke-width="10" />
        <rect class="icono" x="82" y="1048" width="104" height="74" rx="16" />
        <path class="icono" d="M112 1048 l10 -16 h24 l10 16" />
        <circle class="icono" cx="134" cy="1085" r="19" />
        <text class="etiqueta" x="82" y="1166" font-size="30" font-weight="600">cámara</text>
      </g>
      <!-- Cuadros inferiores -->
      <g id="cuadroIzq">
        <rect class="forma" x="36" y="1218" width="366" height="404" rx="32" stroke-width="0" />
        <!-- Montaña y sol: fotos -->
        <circle class="icono suave" cx="326" cy="1290" r="18" />
        <path class="icono suave" d="M72 1470 l84 -96 l52 56 l40 -42 l100 112" />
        <text class="etiqueta suave" x="72" y="1546" font-size="24">Fotos</text>
        <text class="etiqueta" x="72" y="1584" font-size="36" font-weight="600">Selva</text>
      </g>
      <g id="cuadroDer">
        <rect class="forma" x="416" y="1218" width="366" height="404" rx="32" stroke-width="0" />
        <!-- Libreta -->
        <rect class="icono" x="545" y="1318" width="108" height="128" rx="18" />
        <line class="icono" x1="569" y1="1360" x2="629" y2="1360" />
        <line class="icono" x1="569" y1="1386" x2="629" y2="1386" />
        <line class="icono" x1="569" y1="1412" x2="609" y2="1412" />
        <text class="etiqueta" x="599" y="1520" font-size="32" font-weight="600" text-anchor="middle">notas</text>
        <text class="etiqueta suave" x="599" y="1558" font-size="24" text-anchor="middle">3 pendientes</text>
      </g>
    </svg>
  </div>
  <p>Toca el lienzo para repetir</p>

  <script>
    // Física simple: gravedad + rebote amortiguado
    const GRAVEDAD = 7000;      // unidades/s² (coordenadas del viewBox)
    const REBOTE = 0.32;        // fracción de velocidad que se conserva al rebotar
    const V_MIN = 180;          // por debajo de esta velocidad la forma se asienta

    // Orden de caída: de abajo hacia arriba. "espera" = ms tras el primer impacto de la anterior
    // "giro" = grados que rota la forma durante el vuelo (negativo = termina girando en sentido horario)
    const secuencia = [
      { id: 'cuadroIzq',  espera: 0,   giro: -160 },
      { id: 'cuadroDer',  espera: 90,  giro: -220 },
      { id: 'triAbajo',   espera: 260, giro: -120 },
      { id: 'triArriba',  espera: 260, giro: -150 },
      // Después del último triángulo, el resto cae en vertical (sin giro ni desplazamiento lateral)
      { id: 'rectMedio',  espera: 240, vertical: true },
      { id: 'rectGrande', espera: 240, vertical: true },
      { id: 'pildora',    espera: 240, vertical: true },
      { id: 'circulo',    espera: 140, vertical: true },
    ];
    const IMPULSO = -1100;      // velocidad inicial hacia arriba del lanzamiento (unidades/s)

    // Posición + rotación alrededor del centro. El giro se va frenando y llega a 0° al aterrizar.
    function dibujar(c) {
      const avance = c.x0 ? 1 - c.x / c.x0 : 1; // 0 al salir, 1 al aterrizar
      const angulo = c.giro * Math.pow(1 - avance, 1.6);
      c.el.setAttribute('transform',
        `translate(${c.x.toFixed(2)},${c.y.toFixed(2)}) rotate(${angulo.toFixed(2)},${c.cx},${c.cy})`);
    }

    // Temblor ligero de todo el conjunto (animación CSS en el <svg>)
    function temblar() {
      const svg = document.querySelector('#lienzo svg');
      svg.classList.remove('temblor');
      void svg.getBoundingClientRect();   // reinicia la animación si ya estaba aplicada
      svg.classList.add('temblor');
      document.getElementById('lienzo').classList.add('listo');
    }

    let cuerpos = [];
    let raf = null;

    function preparar() {
      cuerpos = secuencia.map((s) => {
        const el = document.getElementById(s.id);
        el.setAttribute('transform', 'translate(0,0)');
        const caja = el.getBBox();
        const cx = caja.x + caja.width / 2;
        const cy = caja.y + caja.height / 2;
        // Radio que cubre la forma en cualquier ángulo, para que empiece oculta aunque esté rotada
        const radio = Math.hypot(caja.width, caja.height) / 2;
        if (s.vertical) {
          // Cae en línea recta desde justo encima del lienzo
          const inicioY = -(caja.y + caja.height + 20);
          const c = { el, espera: s.espera, giro: 0, cx, cy, x0: 0, x: 0, y: inicioY, vx: 0, v: 0, estado: 'esperando', impacto: null };
          dibujar(c);
          return c;
        }
        // Empieza fuera del lienzo, por la esquina superior izquierda
        const inicioY = -(cy + radio + 20);
        const inicioX = -(cx + radio + 20);
        // Tiempo hasta tocar su lugar, lanzada con impulso hacia arriba: y0 + v0·t + g·t²/2 = 0
        const tiempoVuelo = (-IMPULSO + Math.sqrt(IMPULSO * IMPULSO - 2 * GRAVEDAD * inicioY)) / GRAVEDAD;
        // Velocidad horizontal constante para llegar a x = 0 justo al primer impacto
        const vx = -inicioX / tiempoVuelo;
        const c = { el, espera: s.espera, giro: s.giro, cx, cy, x0: inicioX, x: inicioX, y: inicioY, vx, v: IMPULSO, estado: 'esperando', impacto: null };
        dibujar(c);
        return c;
      });
    }

    function iniciar() {
      cancelAnimationFrame(raf);
      document.getElementById('lienzo').classList.remove('listo');
      preparar();
      cuerpos[0].estado = 'cayendo';
      let anterior = performance.now();

      function paso(ahora) {
        const dt = Math.min((ahora - anterior) / 1000, 1 / 30);
        anterior = ahora;
        let activos = false;

        cuerpos.forEach((c, i) => {
          if (c.estado === 'esperando') {
            const previo = cuerpos[i - 1];
            if (previo && previo.impacto !== null && ahora - previo.impacto >= c.espera) {
              c.estado = 'cayendo';
            }
          }
          if (c.estado === 'cayendo') {
            c.v += GRAVEDAD * dt;
            c.y += c.v * dt;
            c.x = Math.min(0, c.x + c.vx * dt);
            if (c.y >= 0) {
              c.y = 0;
              c.x = 0;
              if (c.impacto === null) {
                c.impacto = ahora;
                if (i === cuerpos.length - 1) temblar();   // el último elemento hace temblar a todos
              }
              if (c.v < V_MIN) {
                c.v = 0;
                c.estado = 'quieto';
              } else {
                c.v = -c.v * REBOTE;
              }
            }
            dibujar(c);
          }
          if (c.estado !== 'quieto') activos = true;
        });

        if (activos) raf = requestAnimationFrame(paso);
      }
      raf = requestAnimationFrame(paso);
    }

    document.getElementById('lienzo').addEventListener('click', iniciar);
    window.addEventListener('load', iniciar);
  </script>
</body>
</html>
